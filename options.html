<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PagePilot Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="container">
    <h1>PagePilot Settings</h1>

    <section class="panel">
      <label for="apiKey">Gemini API Key</label>
      <input id="apiKey" type="password" placeholder="Enter your GEMINI_API_KEY" autocomplete="off" />
      <div class="row">
        <button id="saveBtn">Save</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
      <p class="note">The key is stored in extension-local storage and used by the background service worker to proxy model requests. Do not paste keys into web pages.</p>
      <div id="status" class="status" aria-live="polite"></div>
    </section>

  </main>
  <script src="options.js"></script>
</body>
</html>
