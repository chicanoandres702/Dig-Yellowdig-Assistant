<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 350px; font-family: 'Inter', sans-serif; padding: 15px; margin: 0; background: #f8fafc; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { font-size: 18px; color: #064e3b; margin: 0; }
        .card { background: white; border-radius: 12px; padding: 12px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: 4px; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #059669; }
        .footer { font-size: 10px; text-align: center; color: #94a3b8; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dig Assistant</h1>
    </div>
    <button id="saveBtn">Save Settings</button>
    
    <div class="card">
        <div class="input-group">
            <label>GEMINI API KEY</label>
            <input type="text" id="apiKey" placeholder="Paste your key here...">
        </div>
        <div class="input-group">
            <label>AI Backend</label>
            <select id="apiSelect">
                <option value="gemini">Gemini</option>
                <option value="copilot">Copilot</option>
            </select>
        </div>
    </div>

    <div class="card">
        <label>RESOURCES</label>
        <p style="font-size: 12px; color: #475569;">The Dig toolbar is active on Yellowdig. Use the "Context" button to upload your PDFs.</p>
    </div>

    <div class="footer">Social Work & Sociology Resource Hub</div>
    
        <script src="popup.js"></script>
</body>
</html>
