<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dig Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h1>Dig Assistant</h1>
    </div>
    <button id="saveBtn" class="btn btn-primary">Save Settings</button>
    
    <div class="card">
        <div class="input-group">
            <label for="apiKey">GEMINI API KEY</label>
            <input type="text" id="apiKey" placeholder="Paste your key here...">
        </div>
        <div class="input-group">
            <label for="apiSelect">AI Backend</label>
            <select id="apiSelect" aria-label="AI Backend">
                <option value="gemini">Gemini</option>
                <option value="copilot">Copilot</option>
            </select>
        </div>
    </div>

    <div class="card">
        <label>RESOURCES</label>
        <p class="muted">The Dig toolbar is active on Yellowdig. Use the "Context" button to upload your PDFs.</p>
    </div>

    <div class="card" id="diagnostics-card">
        <label>DIAGNOSTICS</label>
        <p class="muted mt-6">Download or stream debug logs for troubleshooting or to send to an external diagnostic endpoint (MCP/webhook).</p>
        <div class="input-group">
            <label for="streamUrl">Stream URL (optional)</label>
            <input type="text" id="streamUrl" placeholder="https://example.local/logs">
        </div>
        <button id="toggleStreamBtn" class="btn btn-stream">Start Streaming Logs</button>
        <button id="downloadLogsBtn" class="btn btn-blue mt-8">Download Logs</button>
        <button id="getPageReportBtn" class="btn btn-azure mt-8">Get Page Report</button>
        <button id="copyDiagBtn" class="btn btn-gray mt-8">Copy Diagnostics</button>
        <button id="clearLogsBtn" class="btn btn-red mt-8">Clear Logs</button>
    </div>

    <div class="footer">Social Work & Sociology Resource Hub</div>
    
        <script src="popup.js"></script>
</body>
</html>
