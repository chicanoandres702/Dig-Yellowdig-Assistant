<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PagePilot Launcher</title>
  <style>
    body { width: 250px; height: 120px; background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; text-align: center; }
    .pulse { width: 20px; height: 20px; background: #38bdf8; border-radius: 50%; animation: pulse 1.5s infinite; margin-bottom: 12px; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(56, 189, 248, 0); } 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); } }
    h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
    p { margin: 8px 0 0; font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="pulse"></div>
  <h2>PagePilot</h2>
  <p>Initializing Mission Control...</p>
  <script src="popup.js"></script>
</body>
</html>
