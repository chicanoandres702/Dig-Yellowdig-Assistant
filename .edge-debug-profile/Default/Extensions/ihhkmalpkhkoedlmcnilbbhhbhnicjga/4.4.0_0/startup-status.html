    <style>
      .bardeen-hint {
        all: unset;

        align-items: center;
        background: #202124;
        border-radius: 8px;
        color: #ffffff;
        display: flex;
        font-family: "Inter" helvetica;
        font-size: 14px;
        font-style: normal;
        font-weight: 500;
        padding: 12px 16px;
        position: fixed;
        right: 8px;
        text-align: center;
        z-index: 2147483647;
      }
      .bardeen-hint > *:not(:first-child) {
        margin-left: 12px;
      }
      #bardeen-loader {
        top: 8px;
      }
      #bardeen-retry {
        top: 58px;
        max-width: 400px;
      }
      #bardeen-retry-btn {
        text-align: center;
      }
      #bardeen-retry-btn button {
        background: #6f60cc;
        border: 0;
        border-radius: 6px;
        color: white;
        font-family: "Inter" helvetica;
        font-size: 14px;
        font-style: normal;
        font-weight: 500;
        margin-top: 16px;
        padding: 12px 16px;
        cursor: pointer;
      }
      #bardeen-retry-btn button:hover {
        background: #8c80d6;
      }
      body:not([data-status="retry"]) #bardeen-retry {
        display: none;
      }
    </style>
