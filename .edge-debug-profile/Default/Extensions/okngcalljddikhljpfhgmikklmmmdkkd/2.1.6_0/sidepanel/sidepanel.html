<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent OS</title>
    <meta name="description" content="AI-powered browser agent that automates web tasks" />
    <meta name="author" content="Agent OS" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f5f5f5;
      }
      #loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100%;
        font-size: 16px;
        font-weight: 600;
        color: #333;
      }
      #error-display {
  display: none;
  padding: 1rem;
  margin: 1rem;
  background-color: #fff0f0;
  border: none;
  border-radius: 8px;
  color: #cc0000;
  font-weight: 500;
      }
      
      /* Modern LLM UI Enhancements */
      h1, h2, h3, h4, h5, h6 {
        font-weight: 700 !important;
        letter-spacing: -0.02em;
      }
      
      button {
        font-weight: 600 !important;
        letter-spacing: -0.01em;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      input, textarea {
        font-weight: 500 !important;
      }
      
      /* Enhanced shadows for depth */
      .shadow-modern {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 
                    0 2px 4px -1px rgba(0, 0, 0, 0.06),
                    0 0 0 1px rgba(0, 0, 0, 0.05);
      }
      
      /* Smooth animations */
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.3);
      }
      
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
      }
      
      .dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading Agent OS...</div>
    <div id="root"></div>
    <div id="error-display"></div>
    
    <!-- JSZip Library for ZIP file creation (Local) -->
    <script src="../src/utils/jszip.min.js"></script>
    
    <!-- ZIP Manager Utility -->
    <script src="../src/utils/zipManager.js"></script>
    
    <!-- Image Extractor with Download Service -->
    <script src="../src/utils/imageExtractor.js"></script>
    
    <!-- Main App -->
    <script src="sidepanel.js"></script>
    <!-- Dynamic welcome banner (updates each time the sidebar becomes visible) -->
    <script src="banner.js"></script>
  </body>
</html>
